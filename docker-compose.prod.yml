# Builds and runs the exact production image Coolify will build, locally.
#   bin/d prod up --build   ->   http://localhost:8080
# Exercises Thruster on port 80 and the entrypoint's db:prepare.
name: svapna-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Local verification only. Production gets a real one from Coolify.
      SECRET_KEY_BASE: "local-verification-only-not-a-real-secret-00000000000000000000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/svapna_production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_MAX_THREADS: "5"
      # Single mode: one worker in cluster mode is a misconfiguration, and this
      # app is fine on threads alone.
      WEB_CONCURRENCY: "0"
    ports:
      # Thruster listens on 80 inside the container, not Puma's 3000.
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svapna_production
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svapna_production"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata_prod:
